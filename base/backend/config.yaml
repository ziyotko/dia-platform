server:
  port: 8091
  mode: debug
  # HTTP 路由前缀（与前端 .env 的 VITE_API_BASE_URL 保持一致）
  api_prefix: /business_base/api
  # 可信反向代理地址：仅当请求来自这些地址时才信任 X-Forwarded-For / X-Real-IP
  trusted_proxies:
    - 127.0.0.1
  # 登录接口限流（防暴力破解，按真实客户端 IP）
  login_rate_limit: 10
  login_rate_window_seconds: 60
  # 验证码接口限流（防刷验证码）
  captcha_rate_limit: 30
  captcha_rate_window_seconds: 60
  # 初始化超管接口限流
  init_rate_limit: 5
  init_rate_window_seconds: 60
  # 令牌换发(POST /auth/refresh)与应用票据兑换(POST /auth/app-ticket/exchange)限流
  refresh_rate_limit: 60
  refresh_rate_window_seconds: 60
  # 子应用一次性接入票据有效期（秒）
  app_ticket_ttl_seconds: 60
  # 上传目录（相对或绝对路径）与单文件大小上限（MB）
  upload_dir: ./uploads
  max_upload_mb: 50
  # 工作流超时提醒的后台扫描间隔（秒），显式设为 0 或负数表示关闭；不配置时默认 600
  workflow_remind_interval_seconds: 600

