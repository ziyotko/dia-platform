redis:
  addr: 127.0.0.1:6379
  password:
  db: 1

jwt:
  secret: base-platform-jwt-secret
  # access token（JWT）有效期（小时）
  expire_hours: 8
  # refresh token 有效期（小时），默认 168（7 天）；改密/禁用/删除用户会立即失效
  refresh_expire_hours: 168
  issuer: base-platform
