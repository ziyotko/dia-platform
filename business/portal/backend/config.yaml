server:
  port: 8084
  host: 0.0.0.0
  # 生产环境务必使用 release；可用环境变量覆盖
  mode: release
  api_prefix: /caamm/api
  upload_dir_prefix: "/caamm"
  max_concurrent_ips: 10
  # 站点分析等公开写接口的限流配置（按真实客户端 IP）。
  # 建议 production 依据真实流量调整，避免正常用户被误伤。
  analytics_rate_limit: 60
  analytics_rate_window_seconds: 60
  # 登录接口限流（防暴力破解，按真实客户端 IP）
  login_rate_limit: 10
  login_rate_window_seconds: 300
  # 验证码接口限流（防刷验证码，按真实客户端 IP）
  captcha_rate_limit: 30
  captcha_rate_window_seconds: 60
  # CORS 白名单（前端来源），生产环境请按实际域名配置，不要使用 *
  allowed_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

database:
  host: '127.0.0.1'
  port: 3305
  username: 'root'
  # 请使用环境变量 PORTAL_DB_PASSWORD 注入，勿提交真实密码到仓库
  password: PORTAL_DB_PASSWORD
  dbname: 'caam_portal'
  charset: 'utf8mb4'
  parse_time: true
  loc: 'Asia/Shanghai'
  timeout: '30s'
  read_timeout: '100s'
  write_timeout: '100s'
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600
  conn_max_idle_time: 600

redis:
  host: localhost
  port: 6379
  password: ""
  db: 9
  db1: 10
  db2: 11


jwt:
  # 请使用环境变量 PORTAL_JWT_SECRET 注入强随机密钥（>=32字符）
  secret: PORTAL_JWT_SECRET
  expires_hour: 24

log:
  level: info
  path: ./logs
