server:
  port: 8092
  host: 0.0.0.0
  # 生产环境务必使用 release；可用环境变量覆盖
  mode: release
  api_prefix: /business_portal/api
  upload_dir_prefix: "/business_portal"
  max_concurrent_ips: 50
  # 非 multipart（JSON）请求体上限（MB）：富文本正文会内联 base64 图片，需留足余量；未配置/<=0 回退 64。
  # 文件上传（multipart）不受此限制，另有单文件限制（视频 800MB、其它 50MB）与 Nginx client_max_body_size 兜底。
  max_json_body_mb: 64
  # 可信反向代理地址，决定 gin 是否信任 X-Forwarded-For / X-Real-IP。
  # 生产环境若经 Nginx 等反向代理，请填入代理实际地址；本机回环保留 127.0.0.1。
  # 若为空白列表，main.go 会回退为 ["127.0.0.1"]。
  trusted_proxies:
    - 127.0.0.1
  # 站点分析等公开写接口的限流配置（按真实客户端 IP）。
  # 建议 production 依据真实流量调整，避免正常用户被误伤。
  analytics_rate_limit: 60
  analytics_rate_window_seconds: 60
  # 登录接口限流（防暴力破解，按真实客户端 IP）
  login_rate_limit: 10
  login_rate_window_seconds: 300
  # 验证码接口限流（防刷验证码，按真实客户端 IP）
  captcha_rate_limit: 30
  captcha_rate_window_seconds: 60
  # 公开只读接口限流（/site-info、/search/articles 等无需认证的查询接口，按真实客户端 IP）
  # 未配置时回退 60 次/60s
  public_rate_limit: 120
  public_rate_window_seconds: 60
  # 文件上传限流（POST /upload，按真实客户端 IP）
  # 该接口对任意已认证账号开放且单文件上限 800MB，限流用于防止循环上传写满磁盘；未配置时回退 60 次/60s
  upload_rate_limit: 30
  upload_rate_window_seconds: 60
  # 防重放/请求签名校验（主动检测与临时封禁）。
  # replay_window_seconds 越小越安全；replay_max_fail 达到后临时封禁来源 IP，防止持续探测。
  # 若存在共享出口 NAT，请适当调大 max_fail，避免误伤正常用户。
  replay_window_seconds: 120
  replay_max_fail: 10
  replay_ban_minutes: 15
  # CORS 白名单（前端来源），生产环境请按实际域名配置，不要使用 *
  # 端口需与 frontend/vite.config.ts 的 server.port 保持一致（当前为 3000）
  allowed_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000

database:
  host: 10.3.1.95
  port: 63400
  username: 'root'
  # 请使用环境变量 PORTAL_DB_PASSWORD 注入，勿提交真实密码到仓库
  password: PORTAL_DB_PASSWORD
  dbname: 'caam_portal'
  charset: 'utf8mb4'
  parse_time: true
  loc: 'Asia/Shanghai'
  timeout: '30s'
  read_timeout: '100s'
  write_timeout: '100s'
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600
  conn_max_idle_time: 600

redis:
  host: localhost
  port: 6379
  password: ""
  db: 6
  db1: 7
  db2: 8


jwt:
  # 请使用环境变量 PORTAL_JWT_SECRET 注入强随机密钥（>=32字符）
  secret: PORTAL_JWT_SECRET
  expires_hour: 24

log:
  level: info
  path: ./logs
