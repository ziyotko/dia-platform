server:
  port: 8094
  # 生产环境务必使用 release；可用环境变量 APPLICATION_MODE 覆盖（如开发机用 debug）
  mode: release
  api_prefix: /business_application/api
  # fileUrl 前缀：仅用于把数据库中带前缀的历史 URL 归一化回 uploads/ 路径（不再静态托管，见 DEPLOY.md「二.5」）
  upload_dir_prefix: /business_application
  max_concurrent_ips: 100
  # CORS 白名单（前端来源），生产环境请按实际域名配置，不要使用 *
  # 端口需与 frontend/vite.config.ts 的 server.port 保持一致（当前为 3003）
  allowed_origins:
    - http://localhost:3003
    - http://127.0.0.1:3003
  # 可信反向代理 IP 列表（用于正确获取客户端真实 IP；限流/审计均按真实 IP 计数）
  # 生产环境请填入 Nginx 等代理的实际地址；本机回环保留 127.0.0.1。
  trusted_proxies:
    - 127.0.0.1
  # 固定窗口限流（次数/分钟，按真实客户端 IP；未配置或 <=0 时回退代码默认值）
  login_rate_limit: 10
  captcha_rate_limit: 30
  upload_rate_limit: 20
  # 非 multipart（JSON）请求体上限（MB）：<=0 回退 64；文件上传（multipart）不受此限制
  max_json_body_mb: 64

mysql:
  host: 10.3.1.95
  port: 63400
  user: root
  # 请使用环境变量 APPLICATION_DB_PASSWORD 注入，勿提交真实密码到仓库
  password: APPLICATION_DB_PASSWORD
  db_name: caam_application
  charset: utf8mb4
  max_open: 50
  max_idle: 10
  # 时区（与 portal / member 同名同义）：推荐显式写 Asia/Shanghai，不依赖部署机时区；
  # 留空则用 Local（此时部署机时区必须是 Asia/Shanghai，否则时间会偏移）
  loc: Asia/Shanghai
  # go-sql-driver 超时参数（留空则不附加，用驱动默认值）
  timeout: 30s
  read_timeout: 100s
  write_timeout: 100s

redis:
  addr: 127.0.0.1:6379
  password:
  captcha_db: 2
  anti_replay_db: 3

jwt:
  # 请使用环境变量 APPLICATION_JWT_SECRET 注入强随机密钥（>=32字符）
  secret: APPLICATION_JWT_SECRET
  expire_hours: 24
  issuer: business-application

log:
  # 日志级别：debug/info/warn/error（非法值回退 info）
  level: info
  path: logs/application.log
  max_size: 100
  max_backups: 30
  max_age: 180
