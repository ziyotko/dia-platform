server:
  port: 8085
  # 生产环境务必使用 release；可用环境变量 MEMBER_MODE 覆盖
  mode: release
  api_prefix: /member/api
  max_concurrent_ips: 100
  upload_dir_prefix: 
  # CORS 白名单（前端来源），生产环境请按实际域名配置，不要使用 *
  allowed_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
  # 可信反向代理 IP 列表（用于正确获取客户端真实 IP）
  trusted_proxies:
    - 127.0.0.1

mysql:
  host: 127.0.0.1
  port: 3305
  user: root
  # 请使用环境变量 MEMBER_DB_PASSWORD 注入，勿提交真实密码到仓库
  password: MEMBER_DB_PASSWORD
  db_name: caam_member
  charset: utf8mb4
  max_open: 50
  max_idle: 10

redis:
  addr: 127.0.0.1:6379
  password: ""
  captcha_db: 11
  anti_replay_db: 12

jwt:
  # 请使用环境变量 MEMBER_JWT_SECRET 注入强随机密钥
  secret: MEMBER_JWT_SECRET
  expire_hours: 24
  issuer: caam-member

log:
  path: logs/member.log
  max_size: 100
  max_backups: 30
  max_age: 180
